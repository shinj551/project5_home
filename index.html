<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Autumn Pavilion</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    
    <header>
        <p class="small-title">A SEASONAL EXPERIENCE 2026</p>
        <h1>THE AUTUMN PAVILION</h1>
        <p class="subtitle">Step Into the Colors of Autumn.</p>
    </header>

    <main class="pavilion">
        <p class="welcome">Step inside and discover four different worlds of autumn.</p>

        <section class="doors">

            <!--art-->

            <a href="art/index.html" class="door-section art">
            <div class="doorway">

                <img src="imgaes/art-door.jpg" class="preview" alt="Art Gallery">
                <div class="door">
                    <span>01</span>
                    <div class="handle"></div>
                </div>
            </div>

            <h2>ART</h2>
            <p>Autumn Through Art</p>
        </a>

            <!--film-->

            <a href="movie/index.html" class="door-section film">
            <div class="doorway">
                <img src="imgaes/movie-door2.jpg" class="preview" alt="Cinema">
                <div class="door">
                    <span>02</span>
                    <div class="handle"></div>
                </div>
            </div>

            <h2>FILM</h2>
            <p>Autumn on Screen</p>
        </a>

        <!--festival-->

            <a href="festival/index.html" class="door-section festival">
            <div class="doorway">  
                <img src="imgaes/festival-door.jpg" class="preview" alt="Autumn Festival">
                <div class="door">
                    
                    <span>03</span>
                    <div class="handle"></div>
                </div>
            </div>

            <h2>FESTIVAL</h2>
            <p>Celebrate Autumn</p>
        </a>

        <!--plant-->

            <a href="plant/index.html" class="door-section nature">

            <div class="doorway">
                <img src="imgaes/plant-door.jpg" class="preview" alt="Nature">
                <div class="door">
                    <span>04</span>
                    <div class="handle"></div>
                </div>
            </div>

            <h2>NATURE</h2>
            <p>Autumn in Nature</p>
        </a>

        </section>

    
    </main>

    <footer>
        <p>THE AUTUMN PAVILION - FALL 2026</p>
    </footer>
</body>
</html>
